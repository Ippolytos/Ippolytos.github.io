function initScramble(iframeDoc) {
  var title = iframeDoc.querySelector('.hero-title');
  if (!title) return;
  var chars = '!<>-_\/[]{}=+*^?#ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  var walker = iframeDoc.createTreeWalker(title, NodeFilter.SHOW_TEXT);
  var textNodes = [];
  var node;
  while (node = walker.nextNode()) {
    if (node.textContent.trim().length > 0)
      textNodes.push({ node: node, original: node.textContent });
  }
  if (!textNodes.length) return;
  title.style.opacity = '1';
  title.style.transform = 'translateY(0) scale(1)';
  title.style.color = 'var(--lavender, #E0D2FF)';
  var totalPhase1 = 14;
  var totalPhase2 = 36;
  var totalFrames = totalPhase1 + totalPhase2;
  var frame = 0;
  var interval = 28;
  function randChar() { return chars[Math.floor(Math.random() * chars.length)]; }
  function tick() {
    frame++;
    if (frame <= totalPhase1) {
      textNodes.forEach(function(tn) {
        var result = '';
        for (var i = 0; i < tn.original.length; i++) {
          var c = tn.original[i];
          result += (c === ' ' || c === '\n') ? c : randChar();
        }
        tn.node.textContent = result;
      });
    } else {
      var progress = (frame - totalPhase1) / totalPhase2;
      textNodes.forEach(function(tn) {
        var result = '';
        for (var i = 0; i < tn.original.length; i++) {
          var c = tn.original[i];
          if (c === ' ' || c === '\n') { result += c; continue; }
          result += (i / tn.original.length < progress) ? c : randChar();
        }
        tn.node.textContent = result;
      });
    }
    if (frame < totalFrames) {
      setTimeout(tick, interval);
    } else {
      textNodes.forEach(function(tn) { tn.node.textContent = tn.original; });
      title.removeAttribute('style');
      title.classList.add('anim-done');
    }
  }
  tick();
}

    // Inject all scripts as plain text into iframe DOM
    var scriptEl = d.createElement('script');
    scriptEl.textContent = "\n/* ═══════════════════════════════════════════════════\n   MARQUEE\n═══════════════════════════════════════════════════ */\n(function(){\n  const items = ['ColorDrop','●','HUE','●','Chroma','●','UpScale','●','Color Obsession','●','Precision Tools','●','Pick · Edit · Recolor · Upscale','●','Built Different','●','Zero Sharpness Loss','●'];\n  const repeated = [...items,...items,...items,...items];\n  const mq = document.getElementById('mq1');\n  mq.innerHTML = repeated.map(t => `<span class=\"${t==='●'?'dot':''}\">${t}</span>`).join('');\n})();\n\n/* ═══════════════════════════════════════════════════\n   TOOL 01 — COLOR PICKER\n═══════════════════════════════════════════════════ */\n(function(){\n  let hue = 0.04, sat = 1, val = 1, alpha = 1;\n  let draggingSV = false, draggingHue = false, draggingAlpha = false;\n\n  const svCanvas = document.getElementById('svCanvas');\n  const hueCanvas = document.getElementById('hueCanvas');\n  const alphaCanvas = document.getElementById('alphaCanvas');\n  const svCursor = document.getElementById('svCursor');\n  const hueInd = document.getElementById('hueIndicator');\n  const alphaInd = document.getElementById('alphaIndicator');\n  const swatchFill = document.getElementById('swatchFill');\n  const hexDisplay = document.getElementById('hexDisplay');\n  const rgbaDisplay = document.getElementById('rgbaDisplay');\n  const copyBtn = document.getElementById('copyBtn');\n  const svWrap = document.getElementById('svWrap');\n  const hueWrap = document.getElementById('hueWrap');\n  const alphaWrap = document.getElementById('alphaWrap');\n\n  function hsvToRgb(h,s,v){\n    let r,g,b;\n    const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);\n    switch(i%6){\n      case 0:r=v;g=t;b=p;break;case 1:r=q;g=v;b=p;break;\n      case 2:r=p;g=v;b=t;break;case 3:r=p;g=q;b=v;break;\n      case 4:r=t;g=p;b=v;break;case 5:r=v;g=p;b=q;break;\n    }\n    return {r:Math.round(r*255),g:Math.round(g*255),b:Math.round(b*255)};\n  }\n\n  function toHex(n){return n.toString(16).padStart(2,'0')}\n  function rgbToHex(r,g,b){return '#'+toHex(r)+toHex(g)+toHex(b)}\n\n  function hexToRgb(hex){\n    const r=/^#?([a-f\\d]{2})([a-f\\d]{2})([a-f\\d]{2})$/i.exec(hex);\n    return r?{r:parseInt(r[1],16),g:parseInt(r[2],16),b:parseInt(r[3],16)}:null;\n  }\n\n  function rgbToHsv(r,g,b){\n    r/=255;g/=255;b/=255;\n    const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;\n    let h=0,s=max===0?0:d/max,v=max;\n    if(d!==0){\n      if(max===r)h=((g-b)/d+(g<b?6:0))/6;\n      else if(max===g)h=((b-r)/d+2)/6;\n      else h=((r-g)/d+4)/6;\n    }\n    return{h,s,v};\n  }\n\n  function drawSV(){\n    const ctx=svCanvas.getContext('2d');\n    const w=svCanvas.width,h=svCanvas.height;\n    const base=hsvToRgb(hue,1,1);\n    const gH=ctx.createLinearGradient(0,0,w,0);\n    gH.addColorStop(0,'white');\n    gH.addColorStop(1,`rgb(${base.r},${base.g},${base.b})`);\n    ctx.fillStyle=gH;ctx.fillRect(0,0,w,h);\n    const gV=ctx.createLinearGradient(0,0,0,h);\n    gV.addColorStop(0,'rgba(0,0,0,0)');\n    gV.addColorStop(1,'rgba(0,0,0,1)');\n    ctx.fillStyle=gV;ctx.fillRect(0,0,w,h);\n  }\n\n  function drawHue(){\n    const ctx=hueCanvas.getContext('2d');\n    const w=hueCanvas.width,h=hueCanvas.height;\n    for(let i=0;i<w;i++){\n      const rgb=hsvToRgb(i/w,1,1);\n      ctx.fillStyle=`rgb(${rgb.r},${rgb.g},${rgb.b})`;\n      ctx.fillRect(i,0,1,h);\n    }\n  }\n\n  function drawAlpha(){\n    const ctx=alphaCanvas.getContext('2d');\n    const w=alphaCanvas.width,h=alphaCanvas.height;\n    const cs=6;\n    for(let y=0;y<h;y+=cs)for(let x=0;x<w;x+=cs){\n      ctx.fillStyle=((x/cs+y/cs)%2===0)?'#fff':'#ccc';\n      ctx.fillRect(x,y,cs,cs);\n    }\n    const rgb=hsvToRgb(hue,sat,val);\n    const g=ctx.createLinearGradient(0,0,0,h);\n    g.addColorStop(0,`rgba(${rgb.r},${rgb.g},${rgb.b},1)`);\n    g.addColorStop(1,`rgba(${rgb.r},${rgb.g},${rgb.b},0)`);\n    ctx.fillStyle=g;ctx.fillRect(0,0,w,h);\n  }\n\n  function updateUI(){\n    const rgb=hsvToRgb(hue,sat,val);\n    const hex=rgbToHex(rgb.r,rgb.g,rgb.b);\n    swatchFill.style.background=`rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;\n    hexDisplay.textContent=alpha===1?hex.toUpperCase():`rgba(${rgb.r},${rgb.g},${rgb.b},${alpha.toFixed(2)})`;\n    rgbaDisplay.textContent=`rgba(${rgb.r},${rgb.g},${rgb.b},${alpha.toFixed(2)})`;\n    // sync number inputs\n    document.getElementById('inR').value=rgb.r;\n    document.getElementById('inG').value=rgb.g;\n    document.getElementById('inB').value=rgb.b;\n    document.getElementById('inA').value=Math.round(alpha*100);\n    // update copy button label\n    const rgbaCopyBtn=document.getElementById('rgbaCopyBtn');\n    if(rgbaCopyBtn) rgbaCopyBtn.querySelector('span.rgba-preview') && (rgbaCopyBtn.querySelector('span.rgba-preview').textContent=`rgba(${rgb.r},${rgb.g},${rgb.b},${alpha.toFixed(2)})`);\n    svCursor.style.left=(sat*100)+'%';\n    svCursor.style.top=((1-val)*100)+'%';\n    hueInd.style.left=(hue*100)+'%';\n    alphaInd.style.top=((1-alpha)*100)+'%';\n    drawAlpha();\n  }\n\n  function getSVPos(e,el){\n    const r=el.getBoundingClientRect();\n    const x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));\n    const y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));\n    return{x,y};\n  }\n\n  // SV drag\n  svWrap.addEventListener('mousedown',e=>{\n    draggingSV=true;\n    const {x,y}=getSVPos(e,svWrap);\n    sat=x;val=1-y;updateUI();\n  });\n\n  // Hue drag\n  hueWrap.addEventListener('mousedown',e=>{\n    draggingHue=true;\n    const r=hueWrap.getBoundingClientRect();\n    hue=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));\n    drawSV();updateUI();\n  });\n\n  // Alpha drag\n  alphaWrap.addEventListener('mousedown',e=>{\n    draggingAlpha=true;\n    const r=alphaWrap.getBoundingClientRect();\n    alpha=Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height));\n    updateUI();\n  });\n\n  document.addEventListener('mousemove',e=>{\n    if(draggingSV){\n      const {x,y}=getSVPos(e,svWrap);sat=x;val=1-y;updateUI();\n    }\n    if(draggingHue){\n      const r=hueWrap.getBoundingClientRect();\n      hue=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));\n      drawSV();updateUI();\n    }\n    if(draggingAlpha){\n      const r=alphaWrap.getBoundingClientRect();\n      alpha=Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height));\n      updateUI();\n    }\n  });\n\n  document.addEventListener('mouseup',()=>{draggingSV=false;draggingHue=false;draggingAlpha=false});\n\n  // Touch support\n  function touchToMouse(e,handler){\n    if(e.touches.length){const t=e.touches[0];handler({clientX:t.clientX,clientY:t.clientY});}\n    e.preventDefault();\n  }\n  svWrap.addEventListener('touchstart',e=>touchToMouse(e,e2=>svWrap.dispatchEvent(new MouseEvent('mousedown',e2))),{passive:false});\n  svWrap.addEventListener('touchmove',e=>touchToMouse(e,e2=>document.dispatchEvent(new MouseEvent('mousemove',e2))),{passive:false});\n  hueWrap.addEventListener('touchstart',e=>touchToMouse(e,e2=>hueWrap.dispatchEvent(new MouseEvent('mousedown',e2))),{passive:false});\n  hueWrap.addEventListener('touchmove',e=>touchToMouse(e,e2=>document.dispatchEvent(new MouseEvent('mousemove',e2))),{passive:false});\n\n  // Hex edit on click\n  hexDisplay.addEventListener('click',()=>{\n    const rgb=hsvToRgb(hue,sat,val);\n    const currentHex=rgbToHex(rgb.r,rgb.g,rgb.b);\n    const input=document.createElement('input');\n    input.type='text';input.value=currentHex.toUpperCase();\n    Object.assign(input.style,{\n      fontFamily:'DM Mono,monospace',fontSize:'18px',fontWeight:'500',\n      color:'var(--text)',background:'var(--card)',border:'1px solid var(--accent)',\n      borderRadius:'2px',padding:'2px 6px',outline:'none',width:'140px',letterSpacing:'1px'\n    });\n    hexDisplay.replaceWith(input);\n    input.select();\n    function commit(){\n      const hex=input.value.trim();\n      const rgb=hexToRgb(hex);\n      if(rgb){const hsv=rgbToHsv(rgb.r,rgb.g,rgb.b);hue=hsv.h;sat=hsv.s;val=hsv.v;drawSV();}\n      input.replaceWith(hexDisplay);\n      updateUI();\n    }\n    input.addEventListener('blur',commit);\n    input.addEventListener('keydown',e=>{if(e.key==='Enter')commit();if(e.key==='Escape'){input.replaceWith(hexDisplay);}});\n  });\n\n  // Copy HEX\n  const toast=document.getElementById('toast');\n  copyBtn.addEventListener('click',()=>{\n    const rgb=hsvToRgb(hue,sat,val);\n    const text=alpha===1?rgbToHex(rgb.r,rgb.g,rgb.b).toUpperCase():`rgba(${rgb.r},${rgb.g},${rgb.b},${alpha.toFixed(2)})`;\n    navigator.clipboard.writeText(text).then(()=>{\n      toast.textContent='Copied '+text;\n      toast.classList.add('show');\n      setTimeout(()=>toast.classList.remove('show'),2000);\n    });\n  });\n\n  // RGBA number input → update picker\n  function applyRgbaInputs(){\n    const r=Math.max(0,Math.min(255,parseInt(document.getElementById('inR').value)||0));\n    const g=Math.max(0,Math.min(255,parseInt(document.getElementById('inG').value)||0));\n    const b=Math.max(0,Math.min(255,parseInt(document.getElementById('inB').value)||0));\n    const a=Math.max(0,Math.min(100,parseInt(document.getElementById('inA').value)||0));\n    const hsv=rgbToHsv(r,g,b);\n    hue=hsv.h; sat=hsv.s; val=hsv.v; alpha=a/100;\n    drawSV(); updateUI();\n  }\n  ['inR','inG','inB','inA'].forEach(id=>{\n    const el=document.getElementById(id);\n    if(!el) return;\n    el.addEventListener('input', applyRgbaInputs);\n    el.addEventListener('change', applyRgbaInputs);\n  });\n\n  // RGBA copy button\n  const rgbaCopyBtn=document.getElementById('rgbaCopyBtn');\n  if(rgbaCopyBtn){\n    rgbaCopyBtn.addEventListener('click',()=>{\n      const rgb=hsvToRgb(hue,sat,val);\n      const text=`rgba(${rgb.r},${rgb.g},${rgb.b},${alpha.toFixed(2)})`;\n      navigator.clipboard.writeText(text).then(()=>{\n        rgbaCopyBtn.textContent='✓ Copied!';\n        rgbaCopyBtn.classList.add('copied');\n        if(toast){toast.textContent='Copied '+text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2000);}\n        setTimeout(()=>{\n          rgbaCopyBtn.innerHTML='<svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/></svg> Copy rgba(…)';\n          rgbaCopyBtn.classList.remove('copied');\n        },2000);\n      });\n    });\n  }\n\n  // Init\n  drawHue();drawSV();updateUI();\n  // initial hue = salmon/orange-ish\n  hue=0.045;sat=0.8;val=1;drawSV();updateUI();\n})();\n\n/* ═══════════════════════════════════════════════════\n   TOOL 02 — HUE IMAGE EDITOR\n═══════════════════════════════════════════════════ */\n(function(){\n  let origImg=null;\n\n  const presets=[\n    {name:'Golden Hour',hue:20,sat:150,bright:110,contrast:110,sepia:30,invert:0,colors:['#ff9a3c','#ffcc70','#e05f00','#ffe0a0','#ff6b00']},\n    {name:'Neon Night',hue:200,sat:250,bright:90,contrast:130,sepia:0,invert:0,colors:['#0ff','#f0f','#00f','#0f0','#ff0']},\n    {name:'Retro Film',hue:10,sat:70,bright:95,contrast:85,sepia:60,invert:0,colors:['#c8a87a','#a07850','#ffe8c0','#704830','#d8c0a0']},\n    {name:'Cyanotype',hue:220,sat:180,bright:100,contrast:110,sepia:0,invert:0,colors:['#003060','#0060b0','#1090e0','#a0d0f0','#e0f0ff']},\n    {name:'Infrared',hue:330,sat:200,bright:105,contrast:120,sepia:0,invert:0,colors:['#ff0066','#ff80b0','#330020','#ff99cc','#660040']},\n    {name:'Acid Trip',hue:120,sat:300,bright:105,contrast:140,sepia:0,invert:0,colors:['#00ff44','#ff4400','#ffff00','#8800ff','#00ffff']},\n  ];\n\n  const dz=document.getElementById('dropZone');\n  const canvas=document.getElementById('editorCanvas');\n  const overlay=document.getElementById('editorOverlay');\n  const noMsg=document.getElementById('noImgMsg');\n  const controls=document.getElementById('editorControls');\n  const fileInput=document.getElementById('editorFileInput');\n\n  function get(id){return document.getElementById(id)}\n\n  function updateFilter(){\n    if(!origImg)return;\n    const hue=get('e-hue-slider').value;\n    const sat=get('e-sat-slider').value;\n    const bright=get('e-bright-slider').value;\n    const contrast=get('e-contrast-slider').value;\n    const sepia=get('e-sepia-slider').value;\n    const invert=get('e-invert-slider').value;\n    get('e-hue-val').textContent=hue+'°';\n    get('e-sat-val').textContent=sat+'%';\n    get('e-bright-val').textContent=bright+'%';\n    get('e-contrast-val').textContent=contrast+'%';\n    get('e-sepia-val').textContent=sepia+'%';\n    get('e-invert-val').textContent=invert+'%';\n    const ctx=canvas.getContext('2d');\n    ctx.filter=`hue-rotate(${hue}deg) saturate(${sat}%) brightness(${bright}%) contrast(${contrast}%) sepia(${sepia}%) invert(${invert}%)`;\n    ctx.clearRect(0,0,canvas.width,canvas.height);\n    ctx.drawImage(origImg,0,0);\n  }\n\n  ['e-hue-slider','e-sat-slider','e-bright-slider','e-contrast-slider','e-sepia-slider','e-invert-slider'].forEach(id=>{\n    get(id).addEventListener('input',updateFilter);\n  });\n\n  function resetSliders(){\n    get('e-hue-slider').value=0;get('e-sat-slider').value=100;\n    get('e-bright-slider').value=100;get('e-contrast-slider').value=100;\n    get('e-sepia-slider').value=0;get('e-invert-slider').value=0;\n    document.querySelectorAll('.preset-btn').forEach(el=>el.classList.remove('active'));\n    updateFilter();\n  }\n\n  get('editorResetSliders').addEventListener('click',resetSliders);\n  get('editorReset').addEventListener('click',resetSliders);\n\n  function buildPresets(){\n    const grid=get('presetsGrid');grid.innerHTML='';\n    presets.forEach((p,i)=>{\n      const el=document.createElement('button');\n      el.className='preset-btn';el.id='preset-'+i;\n      el.innerHTML=`<div class=\"preset-name\">${p.name}</div><div class=\"preset-dots\">${p.colors.map(c=>`<div class=\"preset-dot\" style=\"background:${c}\"></div>`).join('')}</div>`;\n      el.onclick=()=>{\n        get('e-hue-slider').value=p.hue;get('e-sat-slider').value=p.sat;\n        get('e-bright-slider').value=p.bright;get('e-contrast-slider').value=p.contrast;\n        get('e-sepia-slider').value=p.sepia;get('e-invert-slider').value=p.invert;\n        document.querySelectorAll('.preset-btn').forEach(el=>el.classList.remove('active'));\n        el.classList.add('active');updateFilter();\n      };\n      grid.appendChild(el);\n    });\n  }\n\n  function loadEditorImage(file){\n    if(!file)return;\n    const reader=new FileReader();\n    reader.onload=ev=>{\n      const img=new Image();\n      img.onload=()=>{\n        origImg=img;\n        canvas.style.display='block';\n        get('dzIcon').style.display='none';get('dzText').style.display='none';get('dzSub').style.display='none';\n        dz.classList.add('has-image');\n        canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;\n        const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);\n        noMsg.style.display='none';controls.style.display='block';\n        overlay.classList.add('visible');\n        buildPresets();updateFilter();\n      };\n      img.src=ev.target.result;\n    };\n    reader.readAsDataURL(file);\n  }\n\n  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over')});\n  dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));\n  dz.addEventListener('drop',e=>{\n    e.preventDefault();dz.classList.remove('drag-over');\n    const f=e.dataTransfer.files[0];\n    if(f&&f.type.startsWith('image/'))loadEditorImage(f);\n  });\n  dz.addEventListener('click',e=>{\n    if(origImg)return;\n    if(e.target===dz||e.target.classList.contains('drop-icon')||e.target.classList.contains('drop-text')||e.target.classList.contains('drop-sub'))\n      fileInput.click();\n  });\n  fileInput.onchange=e=>loadEditorImage(e.target.files[0]);\n  get('editorNewImg').addEventListener('click',()=>fileInput.click());\n\n  const dlOverlay=document.getElementById('dl-progress-overlay');\n  const dlBar=document.getElementById('dl-progress-bar');\n  const dlPct=document.getElementById('dl-progress-pct');\n  const dlTitle=document.getElementById('dl-progress-title');\n  const dlSub=document.getElementById('dl-progress-sub');\n\n  function showProgress(title,sub){\n    dlTitle.textContent=title;dlSub.textContent=sub;\n    dlBar.style.width='0%';dlPct.textContent='0%';\n    dlOverlay.classList.add('active');\n  }\n  function setProgress(pct){\n    const p=Math.round(pct);\n    dlBar.style.width=p+'%';dlPct.textContent=p+'%';\n  }\n  function hideProgress(){dlOverlay.classList.remove('active');}\n\n  function exportImg(fmt){\n    if(!origImg)return;\n    const mime=fmt==='jpeg'?'image/jpeg':fmt==='webp'?'image/webp':'image/png';\n    const quality=fmt==='png'?1:0.93;\n    const w=origImg.naturalWidth, h=origImg.naturalHeight;\n\n    showProgress('Rendering image…','Applying filters at full resolution');\n    setProgress(10);\n\n    // Use OffscreenCanvas when available for off-main-thread speed\n    const useOffscreen=typeof OffscreenCanvas!=='undefined';\n    const ex=useOffscreen?new OffscreenCanvas(w,h):document.createElement('canvas');\n    if(!useOffscreen){ex.width=w;ex.height=h;}\n    const ectx=ex.getContext('2d');\n    const hue=get('e-hue-slider').value,sat=get('e-sat-slider').value;\n    const bright=get('e-bright-slider').value,contrast=get('e-contrast-slider').value;\n    const sepia=get('e-sepia-slider').value,inv=get('e-invert-slider').value;\n    ectx.filter=`hue-rotate(${hue}deg) saturate(${sat}%) brightness(${bright}%) contrast(${contrast}%) sepia(${sepia}%) invert(${inv}%)`;\n    ectx.drawImage(origImg,0,0,w,h);\n    setProgress(55);\n\n    const blobPromise=useOffscreen\n      ?ex.convertToBlob({type:mime,quality})\n      :new Promise(res=>ex.toBlob(res,mime,quality));\n\n    blobPromise.then(blob=>{\n      setProgress(90);\n      const url=URL.createObjectURL(blob);\n      const a=document.createElement('a');a.href=url;a.download='hue-edited.'+fmt;a.target='_blank';document.body.appendChild(a);a.click();document.body.removeChild(a);\n      URL.revokeObjectURL(url);\n      setProgress(100);\n      setTimeout(hideProgress,600);\n    });\n  }\n\n  get('exportPng').addEventListener('click',()=>exportImg('png'));\n  get('exportJpg').addEventListener('click',()=>exportImg('jpeg'));\n  get('exportWebp').addEventListener('click',()=>exportImg('webp'));\n})();\n\n/* ═══════════════════════════════════════════════════\n   TOOL 03 — IMAGE RECOLOR\n═══════════════════════════════════════════════════ */\n(function(){\n  const canvas=document.getElementById('recolorCanvas');\n  const ctx=canvas.getContext('2d',{willReadFrequently:true});\n  const fileInput=document.getElementById('recolorFileInput');\n  const uploadZone=document.getElementById('recolorUpload');\n  const selectBtn=document.getElementById('recolorSelectBtn');\n  const canvasPanel=document.getElementById('canvasPanel');\n  const swatchesContainer=document.getElementById('swatchesContainer');\n  const strengthSlider=document.getElementById('strengthSlider');\n  const smoothSlider=document.getElementById('smoothSlider');\n  const strengthVal=document.getElementById('strengthVal');\n  const smoothVal=document.getElementById('smoothVal');\n  const applyBtn=document.getElementById('applyBtn');\n  const resetBtn=document.getElementById('resetBtn');\n  const downloadBtn=document.getElementById('downloadBtn');\n  const addColorBtn=document.getElementById('addColorBtn');\n  const removeColorBtn=document.getElementById('removeColorBtn');\n  const loadJsonBtn=document.getElementById('loadJsonBtn');\n  const jsonInput=document.getElementById('jsonInput');\n\n  // Quality & mode toggles\n  let quality='high',mode='smooth';\n  document.querySelectorAll('#qualityGroup .toggle-btn').forEach(btn=>{\n    btn.addEventListener('click',()=>{\n      document.querySelectorAll('#qualityGroup .toggle-btn').forEach(b=>b.classList.remove('active'));\n      btn.classList.add('active');quality=btn.dataset.quality;\n    });\n  });\n  document.querySelectorAll('#modeGroup .toggle-btn').forEach(btn=>{\n    btn.addEventListener('click',()=>{\n      document.querySelectorAll('#modeGroup .toggle-btn').forEach(b=>b.classList.remove('active'));\n      btn.classList.add('active');mode=btn.dataset.mode;\n    });\n  });\n\n  strengthSlider.addEventListener('input',e=>{strengthVal.textContent=(e.target.value/100).toFixed(2)});\n  smoothSlider.addEventListener('input',e=>{smoothVal.textContent=(e.target.value/100).toFixed(2)});\n\n  let origImgEl=null,previewImageData=null,fullResImageData=null;\n\n  // Build default palette — Noice violet cosmos + aurora teal\n  const defaultColors=['#B7A4FF','#9F88D9','#D0BDF2','#4A8FAD','#6AAFCD','#57A86A'];\n  // Build default palette with staggered pop-in\n  function buildDefaultSwatches(){\n    defaultColors.forEach((hex, i)=>{\n      setTimeout(()=>addSwatch(hex, true), i * 60);\n    });\n  }\n\n  function addSwatch(hex, animate=false){\n    const sw=document.createElement('div');\n    sw.className='swatch';sw.style.background=hex;\n    sw.innerHTML=`<input type=\"color\" value=\"${hex}\">`;\n    sw.querySelector('input').onchange=e=>{\n      e.target.parentElement.style.background=e.target.value;\n      sw.classList.remove('pulse');\n      void sw.offsetWidth; // reflow\n      sw.classList.add('pulse');\n      sw.addEventListener('animationend',()=>sw.classList.remove('pulse'),{once:true});\n    };\n    swatchesContainer.appendChild(sw);\n    if(animate){\n      sw.classList.add('entering');\n      sw.addEventListener('animationend',()=>sw.classList.remove('entering'),{once:true});\n    }\n  }\n\n  buildDefaultSwatches();\n\n  function getPalette(){\n    return Array.from(document.querySelectorAll('#swatchesContainer .swatch input')).map(i=>i.value);\n  }\n\n  function hexToRgb(hex){\n    const m=/^#?([a-f\\d]{2})([a-f\\d]{2})([a-f\\d]{2})$/i.exec(hex);\n    return m?[parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)]:null;\n  }\n\n  addColorBtn.addEventListener('click',()=>{\n    const rand='#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');\n    addSwatch(rand, true);\n  });\n\n  removeColorBtn.addEventListener('click',()=>{\n    const swatches=document.querySelectorAll('#swatchesContainer .swatch');\n    if(swatches.length>1)swatches[swatches.length-1].remove();\n  });\n\n  loadJsonBtn.addEventListener('click',()=>jsonInput.click());\n  jsonInput.addEventListener('change',e=>{\n    const file=e.target.files[0];if(!file)return;\n    const reader=new FileReader();\n    reader.onload=ev=>{\n      try{\n        let colors=JSON.parse(ev.target.result);\n        if(colors.colors)colors=colors.colors;\n        if(colors.length&&typeof colors[0]==='object'&&colors[0].hex)colors=colors.map(c=>c.hex);\n        if(!colors.length)throw new Error();\n        document.querySelectorAll('#swatchesContainer .swatch').forEach(s=>s.remove());\n        colors.forEach((hex,i)=>setTimeout(()=>addSwatch(hex,true),i*55));\n      }catch{alert('Invalid palette JSON');}\n      jsonInput.value='';\n    };\n    reader.readAsText(file);\n  });\n\n  uploadZone.addEventListener('click',()=>fileInput.click());\n  selectBtn.addEventListener('click',e=>{e.stopPropagation();fileInput.click()});\n\n  fileInput.onchange=e=>{if(e.target.files[0])loadRecolorImage(e.target.files[0]);};\n\n  // Drag & drop on upload zone\n  uploadZone.addEventListener('dragover',e=>{e.preventDefault();uploadZone.style.borderColor='var(--accent)'});\n  uploadZone.addEventListener('dragleave',()=>uploadZone.style.borderColor='');\n  uploadZone.addEventListener('drop',e=>{\n    e.preventDefault();uploadZone.style.borderColor='';\n    const f=e.dataTransfer.files[0];\n    if(f&&f.type.startsWith('image/'))loadRecolorImage(f);\n  });\n\n  function loadRecolorImage(file){\n    const reader=new FileReader();\n    reader.onload=e=>{\n      const img=new Image();\n      img.onload=()=>{\n        origImgEl=img;\n        const nw=img.naturalWidth, nh=img.naturalHeight;\n\n        // Store full-res pixel data for export\n        const fullCanvas=document.createElement('canvas');\n        fullCanvas.width=nw; fullCanvas.height=nh;\n        const fullCtx=fullCanvas.getContext('2d',{willReadFrequently:true});\n        fullCtx.drawImage(img,0,0,nw,nh);\n        fullResImageData=fullCtx.getImageData(0,0,nw,nh);\n\n        // Downscale for preview/processing speed\n        let w=nw, h=nh;\n        const maxDim=quality==='high'?1200:quality==='med'?800:500;\n        if(w>maxDim||h>maxDim){\n          if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}\n          else{w=Math.round(w*maxDim/h);h=maxDim;}\n        }\n        canvas.width=w;canvas.height=h;\n        ctx.filter='none';ctx.drawImage(img,0,0,w,h);\n        previewImageData=ctx.getImageData(0,0,w,h);\n        canvasPanel.style.display='block';\n        downloadBtn.style.display='none';\n        uploadZone.style.display='none';\n      };\n      img.src=e.target.result;\n    };\n    reader.readAsDataURL(file);fileInput.value='';\n  }\n\n  resetBtn.addEventListener('click',()=>{\n    if(previewImageData){ctx.filter='none';ctx.putImageData(previewImageData,0,0);}\n    downloadBtn.style.display='none';\n  });\n\n  function recolorPixels(srcData,w,h){\n    const palette=getPalette().map(hexToRgb).filter(Boolean);\n    if(!palette.length)return srcData;\n    const outData=new ImageData(w,h);\n    const src=srcData.data,dst=outData.data;\n    const strength=parseFloat(strengthVal.textContent);\n    const smoothFactor=parseFloat(smoothVal.textContent);\n    const sigma=mode==='blocky'?1:(30+smoothFactor*150);\n    const invSigma2=sigma>0.1?1/(sigma*sigma):10000;\n\n    for(let i=0;i<src.length;i+=4){\n      const a=src[i+3];\n      if(a===0){dst[i]=src[i];dst[i+1]=src[i+1];dst[i+2]=src[i+2];dst[i+3]=0;continue;}\n      const r=src[i],g=src[i+1],b=src[i+2];\n\n      if(mode==='blocky'){\n        let best=palette[0],minD=Infinity;\n        for(const p of palette){\n          const d=(r-p[0])**2+(g-p[1])**2+(b-p[2])**2;\n          if(d<minD){minD=d;best=p;}\n        }\n        dst[i]=Math.round(r+(best[0]-r)*strength);\n        dst[i+1]=Math.round(g+(best[1]-g)*strength);\n        dst[i+2]=Math.round(b+(best[2]-b)*strength);\n        dst[i+3]=a;\n      } else {\n        let wSum=0,cR=0,cG=0,cB=0;\n        for(const p of palette){\n          const d2=(r-p[0])**2+(g-p[1])**2+(b-p[2])**2;\n          const w=Math.exp(-d2*invSigma2);\n          wSum+=w;cR+=p[0]*w;cG+=p[1]*w;cB+=p[2]*w;\n        }\n        if(wSum>0){cR/=wSum;cG/=wSum;cB/=wSum;}\n        dst[i]=Math.round(r+(cR-r)*strength);\n        dst[i+1]=Math.round(g+(cG-g)*strength);\n        dst[i+2]=Math.round(b+(cB-b)*strength);\n        dst[i+3]=a;\n      }\n    }\n    return outData;\n  }\n\n  applyBtn.addEventListener('click',()=>{\n    if(!previewImageData)return;\n    applyBtn.textContent='Processing…';applyBtn.disabled=true;\n    setTimeout(()=>{\n      const out=recolorPixels(previewImageData,canvas.width,canvas.height);\n      ctx.putImageData(out,0,0);\n      downloadBtn.style.display='inline-flex';\n      applyBtn.textContent='Apply Recolor';applyBtn.disabled=false;\n    },16);\n  });\n\n  downloadBtn.addEventListener('click',()=>{\n    if(!fullResImageData||!origImgEl)return;\n\n    const nw=origImgEl.naturalWidth, nh=origImgEl.naturalHeight;\n    const palette=getPalette().map(hexToRgb).filter(Boolean);\n    if(!palette.length)return;\n\n    const dlOverlay=document.getElementById('dl-progress-overlay');\n    const dlBar=document.getElementById('dl-progress-bar');\n    const dlPct=document.getElementById('dl-progress-pct');\n    const dlTitle=document.getElementById('dl-progress-title');\n    const dlSub=document.getElementById('dl-progress-sub');\n\n    dlTitle.textContent='Recoloring at full resolution…';\n    dlSub.textContent=`${nw} × ${nh} px — processing in chunks`;\n    dlBar.style.width='0%';dlPct.textContent='0%';\n    dlOverlay.classList.add('active');\n    downloadBtn.disabled=true;\n\n    const strength=parseFloat(strengthVal.textContent);\n    const smoothFactor=parseFloat(smoothVal.textContent);\n    const sigma=mode==='blocky'?1:(30+smoothFactor*150);\n    const invSigma2=sigma>0.1?1/(sigma*sigma):10000;\n\n    const src=fullResImageData.data;\n    const outData=new ImageData(nw,nh);\n    const dst=outData.data;\n    const totalPx=nw*nh;\n    // Process in chunks of ~80k pixels so the browser can breathe\n    const CHUNK=80000;\n    let idx=0;\n\n    function processChunk(){\n      const end=Math.min(idx+CHUNK,totalPx);\n      for(let pi=idx;pi<end;pi++){\n        const i=pi*4;\n        const a=src[i+3];\n        if(a===0){dst[i]=src[i];dst[i+1]=src[i+1];dst[i+2]=src[i+2];dst[i+3]=0;continue;}\n        const r=src[i],g=src[i+1],b=src[i+2];\n        if(mode==='blocky'){\n          let best=palette[0],minD=Infinity;\n          for(const p of palette){\n            const d=(r-p[0])**2+(g-p[1])**2+(b-p[2])**2;\n            if(d<minD){minD=d;best=p;}\n          }\n          dst[i]=Math.round(r+(best[0]-r)*strength);\n          dst[i+1]=Math.round(g+(best[1]-g)*strength);\n          dst[i+2]=Math.round(b+(best[2]-b)*strength);\n          dst[i+3]=a;\n        } else {\n          let wSum=0,cR=0,cG=0,cB=0;\n          for(const p of palette){\n            const d2=(r-p[0])**2+(g-p[1])**2+(b-p[2])**2;\n            const w=Math.exp(-d2*invSigma2);\n            wSum+=w;cR+=p[0]*w;cG+=p[1]*w;cB+=p[2]*w;\n          }\n          if(wSum>0){cR/=wSum;cG/=wSum;cB/=wSum;}\n          dst[i]=Math.round(r+(cR-r)*strength);\n          dst[i+1]=Math.round(g+(cG-g)*strength);\n          dst[i+2]=Math.round(b+(cB-b)*strength);\n          dst[i+3]=a;\n        }\n      }\n      idx=end;\n      const pct=Math.round(idx/totalPx*85); // 0–85% for processing\n      dlBar.style.width=pct+'%';dlPct.textContent=pct+'%';\n\n      if(idx<totalPx){\n        setTimeout(processChunk,0); // yield to browser between chunks\n      } else {\n        // Encoding phase\n        dlTitle.textContent='Encoding PNG…';\n        dlSub.textContent='Almost done!';\n        dlBar.style.width='90%';dlPct.textContent='90%';\n\n        setTimeout(()=>{\n          const useOffscreen=typeof OffscreenCanvas!=='undefined';\n          const exportCanvas=useOffscreen?new OffscreenCanvas(nw,nh):document.createElement('canvas');\n          if(!useOffscreen){exportCanvas.width=nw;exportCanvas.height=nh;}\n          exportCanvas.getContext('2d').putImageData(outData,0,0);\n\n          const blobPromise=useOffscreen\n            ?exportCanvas.convertToBlob({type:'image/png'})\n            :new Promise(res=>exportCanvas.toBlob(res,'image/png'));\n\n          blobPromise.then(blob=>{\n            dlBar.style.width='100%';dlPct.textContent='100%';\n            const url=URL.createObjectURL(blob);\n            const a=document.createElement('a');\n            a.download='chroma-recolored.png';a.href=url;a.target='_blank';document.body.appendChild(a);a.click();document.body.removeChild(a);\n            URL.revokeObjectURL(url);\n            downloadBtn.disabled=false;\n            setTimeout(()=>dlOverlay.classList.remove('active'),700);\n          });\n        },30);\n      }\n    }\n\n    // Kick off first chunk after overlay renders\n    setTimeout(processChunk,60);\n  });\n\n  // ── Remove Image ──────────────────────────────────────\n  const removeImgBtn = document.getElementById('removeImgBtn');\n  if(removeImgBtn){\n    removeImgBtn.addEventListener('click', ()=>{\n      // Clear state\n      origImgEl = null;\n      previewImageData = null;\n      fullResImageData = null;\n      // Clear canvas\n      ctx.clearRect(0, 0, canvas.width, canvas.height);\n      canvas.width = 0; canvas.height = 0;\n      // Hide canvas panel, show upload zone again\n      canvasPanel.style.display = 'none';\n      uploadZone.style.display = '';\n      downloadBtn.style.display = 'none';\n      // Reset file input so the same file can be re-added\n      fileInput.value = '';\n    });\n  }\n})();\n\n/* ═══════════════════════════════════════════════════\n   AMBIENT AUDIO ENGINE — soft, dreamy, relaxing\n   · Slower BPM (58) · Pure sine/triangle pads only\n   · Long slow attack & release · Reverb-style delay\n   · No harsh snare · Gentle ghost kick · Quiet hats\n   · Volume ceiling lowered to 0.55\n═══════════════════════════════════════════════════ */\n(function(){\n  let audioCtx=null,masterGain=null,reverbNode=null,isPlaying=false;\n  let scheduledNodes=[],loopTimeoutId=null,nextEventTime=0;\n\n  /* Dreamy minor / major 7ths — relaxing chord palette */\n  const chordSets=[\n    [0,4,7,11],   // maj7\n    [0,3,7,10],   // min7\n    [0,4,7,14],   // maj9  (open)\n    [0,3,7,14],   // min9\n    [0,5,7,12],   // sus2  (floaty)\n  ];\n  const melodyOffsets=[0,2,4,7,9,12,14,16]; // pentatonic-ish, no half-steps\n  const rootNotes=[52,55,57,48,50];  // E3 G3 A3 C3 D3 — warm low roots\n  let chordIdx=0;\n\n  const BPM=58;            // slow, breathing pace\n  const BEAT=60/BPM;\n  const BAR=BEAT*4;\n\n  function midiToFreq(m){return 440*Math.pow(2,(m-69)/12)}\n\n  function initAudio(){\n    if(audioCtx)return;\n    audioCtx=new(window.AudioContext||window.webkitAudioContext)();\n\n    /* master gain — quiet ceiling */\n    masterGain=audioCtx.createGain();\n    masterGain.gain.setValueAtTime(0,audioCtx.currentTime);\n    masterGain.connect(audioCtx.destination);\n\n    /* simple reverb via convolver with synthesised impulse */\n    reverbNode=audioCtx.createConvolver();\n    const sRate=audioCtx.sampleRate;\n    const revLen=sRate*2.8;  // 2.8 s tail\n    const revBuf=audioCtx.createBuffer(2,revLen,sRate);\n    for(let c=0;c<2;c++){\n      const d=revBuf.getChannelData(c);\n      for(let i=0;i<revLen;i++)\n        d[i]=(Math.random()*2-1)*Math.pow(1-i/revLen,2.2);\n    }\n    reverbNode.buffer=revBuf;\n    const revGain=audioCtx.createGain();\n    revGain.gain.setValueAtTime(0.32,audioCtx.currentTime);\n    reverbNode.connect(revGain);\n    revGain.connect(masterGain);\n  }\n\n  /* Soft pad note — sine + detuned triangle, long envelope */\n  function playPad(freq,st,dur,vol=0.055){\n    const o1=audioCtx.createOscillator(),g1=audioCtx.createGain();\n    const o2=audioCtx.createOscillator(),g2=audioCtx.createGain();\n    o1.type='sine';    o1.frequency.setValueAtTime(freq,st);\n    o2.type='triangle';o2.frequency.setValueAtTime(freq*1.003,st);\n    const att=dur*0.28, rel=dur*0.52;\n    [[g1,vol*0.6],[g2,vol*0.4]].forEach(([gn,gv])=>{\n      gn.gain.setValueAtTime(0,st);\n      gn.gain.linearRampToValueAtTime(gv,st+att);\n      gn.gain.setValueAtTime(gv,st+dur-rel);\n      gn.gain.exponentialRampToValueAtTime(0.0001,st+dur);\n    });\n    /* warm lowpass — cut everything harsh */\n    const lpf=audioCtx.createBiquadFilter();\n    lpf.type='lowpass';lpf.frequency.setValueAtTime(900,st);lpf.Q.setValueAtTime(0.4,st);\n    o1.connect(g1);o2.connect(g2);\n    g1.connect(lpf);g2.connect(lpf);\n    lpf.connect(masterGain);\n    /* also send to reverb */\n    lpf.connect(reverbNode);\n    o1.start(st);o1.stop(st+dur+0.1);\n    o2.start(st);o2.stop(st+dur+0.1);\n    scheduledNodes.push(o1,o2);\n  }\n\n  /* Sub bass — barely audible, just warmth */\n  function playBass(freq,st){\n    const o=audioCtx.createOscillator(),g=audioCtx.createGain();\n    o.type='sine';o.frequency.setValueAtTime(freq/2,st);\n    g.gain.setValueAtTime(0,st);\n    g.gain.linearRampToValueAtTime(0.09,st+0.4);\n    g.gain.exponentialRampToValueAtTime(0.0001,st+BEAT*2.5);\n    o.connect(g);g.connect(masterGain);\n    o.start(st);o.stop(st+BEAT*3);\n    scheduledNodes.push(o);\n  }\n\n  /* Ghost kick — very soft thump, no click */\n  function playKick(st){\n    const o=audioCtx.createOscillator(),g=audioCtx.createGain();\n    o.type='sine';\n    o.frequency.setValueAtTime(80 r only */\n    const melCount=Math.random()<0.4?1:2;\n    const offs=[BEAT*0.5,BEAT*1,BEAT*2,BEAT*2.5,BEAT*3];\n    const used=new Set();\n    for(let m=0;m<melCount;m++){\n      let off;\n      do{off=offs[Math.floor(Math.random()*offs.length)]}while(used.has(off));\n      used.add(off);\n      const semi=melodyOffsets[Math.floor(Math.random()*melodyOffsets.length)];\n      playPad(midiToFreq(root+12+semi), st+off, BEAT*1.8, 0.038);\n    }\n\n    /* very soft kick only on beat 1 */\n    playKick(st);\n\n    /* ghost hats — only 3-4 per bar, very quiet */\n    const hatTimes=[0, BEAT, BEAT*2, BEAT*3];\n    hatTimes.forEach(ht=>{\n      if(Math.random()<0.65)\n        playHat(st+ht, 0.008+Math.random()*0.009);\n    });\n\n    chordIdx++;\n  }\n\n  function startScheduler(){\n    nextEventTime=audioCtx.currentTime+0.15;\n    scheduleBar(nextEventTime);nextEventTime+=BAR;\n    function tick(){\n      if(!isPlaying)return;\n      while(nextEventTime<audioCtx.currentTime+0.4){\n        scheduleBar(nextEventTime);nextEventTime+=BAR;\n      }\n      loopTimeoutId=setTimeout(tick,100);\n    }\n    loopTimeoutId=setTimeout(tick,100);\n  }\n\n  function stopScheduler(){\n    clearTimeout(loopTimeoutId);\n    scheduledNodes.forEach(n=>{try{n.stop()}catch(e){}});\n    scheduledNodes=[];\n  }\n\n  /* Slow, gentle fade — 3 s in, 2 s out */\n  function fadeIn(){\n    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);\n    masterGain.gain.setValueAtTime(masterGain.gain.value,audioCtx.currentTime);\n    masterGain.gain.linearRampToValueAtTime(0.55,audioCtx.currentTime+3.0);\n  }\n\n  function fadeOut(cb){\n    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);\n    masterGain.gain.setValueAtTime(masterGain.gain.value,audioCtx.currentTime);\n    masterGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+2.0);\n    setTimeout(cb,2100);\n  }\n\n  const audioBtn=document.getElementById('audio-toggle');\n  const audioLabel=document.getElementById('audio-label');\n\n  audioBtn.addEventListener('click',()=>{\n    initAudio();\n    if(audioCtx.state==='suspended')audioCtx.resume();\n    if(!isPlaying){\n      isPlaying=true;\n      audioBtn.classList.add('playing');\n      audioLabel.textContent='playing';\n      createCrackle();startScheduler();fadeIn();\n    } else {\n      fadeOut(()=>{isPlaying=false;stopScheduler()});\n      audioBtn.classList.remove('playing');\n      audioLabel.textContent='lo-fi';\n    }\n  });\n})();\n\n\n\n/* ═══════════════════════════════════════════════════\n   GRID CELL ILLUMINATION — grid squares near the cursor\n   light up and fade out like glowing keyboard keys\n═══════════════════════════════════════════════════ */\n(function(){\n  const canvas = document.getElementById('bg-brush-canvas');\n  if(!canvas) return;\n  const ctx = canvas.getContext('2d');\n\n  const CELL   = 48;   // matches the CSS grid in body::before\n  const RADIUS = 3;    // cells lit up around cursor (Chebyshev)\n  const DECAY  = 0.055; // how fast brightness fades per frame (0–1)\n\n  // Dark mode: accent_lavender → accent_plum drift\n  const DARK_A = [183, 164, 255]; // accent_lavender      #B7A4FF\n  const DARK_B = [159, 136, 217]; // accent_plum          #9F88D9\n  // Light mode: aurora_blue_deep → aurora_blue_bright (teal, vivid on warm bg)\n  const LIGHT_A = [ 46, 115, 145]; // aurora_blue_deep    #2E7391\n  const LIGHT_B = [106, 175, 205]; // aurora_blue_bright  #6AAFCD\n  let hueT = 0;\n\n  function accentRGB(t) {\n    const isLight = document.documentElement.getAttribute('data-theme') === 'light';\n    const A = isLight ? LIGHT_A : DARK_A;\n    const B = isLight ? LIGHT_B : DARK_B;\n    return [\n      Math.round(A[0] + (B[0] - A[0]) * t),\n      Math.round(A[1] + (B[1] - A[1]) * t),\n      Math.round(A[2] + (B[2] - A[2]) * t),\n    ];\n  }\n\n  let W, H, cols, rows;\n  // sparse Map: key = \"col,row\", value = brightness 0..1\n  let cells = new Map();\n\n  function resize() {\n    W = canvas.width  = window.innerW gScale,0.9837));\n  var sigma=Math.min(2.5,0.6+0.2*logScale);\n  var ctx=result.getContext('2d'),imgd=ctx.getImageData(0,0,tw,th),d=imgd.data,n=tw*th;\n  var R=new Float64Array(n),G=new Float64Array(n),B=new Float64Array(n);\n  for(var i=0;i<n;i++){R[i]=d[i*4];G[i]=d[i*4+1];B[i]=d[i*4+2];}\n  usUsmFloat(R,tw,th,amount*0.55*usSharpCoeff,sigma);usUsmFloat(G,tw,th,amount*0.55*usSharpCoeff,sigma);usUsmFloat(B,tw,th,amount*0.55*usSharpCoeff,sigma);\n  usUsmFloat(R,tw,th,amount*0.45*usSharpCoeff,sigma*0.55);usUsmFloat(G,tw,th,amount*0.45*usSharpCoeff,sigma*0.55);usUsmFloat(B,tw,th,amount*0.45*usSharpCoeff,sigma*0.55);\n  usUsmFloat(R,tw,th,amount*0.25*usSharpCoeff,sigma*0.25);usUsmFloat(G,tw,th,amount*0.25*usSharpCoeff,sigma*0.25);usUsmFloat(B,tw,th,amount*0.25*usSharpCoeff,sigma*0.25);\n  for(var j=0;j<n;j++){\n    d[j*4]=Math.max(0,Math.min(255,Math.round(R[j])));\n    d[j*4+1]=Math.max(0,Math.min(255,Math.round(G[j])));\n    d[j*4+2]=Math.max(0,Math.min(255,Math.round(B[j])));\n  }\n  ctx.putImageData(imgd,0,0);return result;\n}\n\nasync function usDoUpscale(){\n  if(!usSrcImg){alert('Upload an image first.');return;}\n  if(!usOutW||!usOutH){alert('Set a target width and height first.');return;}\n  if(usNeedsCrop&&usCropW<1){alert('Draw a crop region on the image first.');return;}\n\n  // ── Fullscreen overlay helpers ──\n  var usOvEl   = document.getElementById('us-progress-overlay');\n  var usOvBar  = document.getElementById('us-ov-bar');\n  var usOvPct  = document.getElementById('us-ov-pct');\n  var usOvTitle= document.getElementById('us-ov-title');\n  var usOvSub  = document.getElementById('us-ov-sub');\n  var usOvEta  = document.getElementById('us-ov-eta');\n  var _startTs = Date.now();\n\n  function ovShow(title,sub){\n    usOvTitle.textContent=title;\n    usOvSub.textContent=sub;\n    usOvEl.classList.add('active');\n  }\n  function ovSet(pct,label,eta){\n    var p=Math.max(0,Math.min(100,Math.round(pct)));\n    usOvBar.style.width=p+'%';\n    usOvPct.textContent=p+'%';\n    if(label)usOvSub.textContent=label;\n    if(eta!=null){\n      usOvEta.textContent=eta>0?'~'+Math.ceil(eta)+'s remaining':'Almost done…';\n    }else{usOvEta.textContent='';}\n  }\n  function ovHide(){\n    setTimeout(function(){usOvEl.classList.remove('active');},700);\n  }\n\n  function tick(){return new Promise(function(r){setTimeout(r,0);});}\n\n  usUpscalebtn.disabled=true;usUpscalebtn.textContent='Processing…';\n  usResultcard.style.display='none';\n\n  // Show overlay and let it paint\n  ovShow('Upscaling image…','Extracting source region');\n  ovSet(2,'Extracting source region…',null);\n  await tick();\n\n  var sx=usNeedsCrop?usCropX:0,sy=usNeedsCrop?usCropY:0;\n  var sw=usNeedsCrop?usCropW:usSrcW,sh=usNeedsCrop?usCropH:usSrcH;\n  var srcCv=document.createElement('canvas');srcCv.width=sw;srcCv.height=sh;\n  srcCv.getContext('2d').drawImage(usSrcImg,sx,sy,sw,sh,0,0,sw,sh);\n\n  ovSet(6,'Multi-step pre-scaling…',null);await tick();\n\n  // ── Multi-step pre-scale (browser bilinear, fast) ──\n  var cur=srcCv;\n  while(cur.width<usOutW*0.5||cur.height<usOutH*0.5){\n    var nw2=Math.min(cur.width*2,usOutW),nh2=Math.min(cur.height*2,usOutH);\n    var t2=document.createElement('canvas');t2.width=nw2;t2.height=nh2;\n    var c2=t2.getContext('2d');c2.imageSmoothingEnabled=true;c2.imageSmoothingQuality='high';\n    c2.drawImage(cur,0,0,nw2,nh2);cur=t2;\n  }\n  var preSrcCtx=cur.getContext('2d');\n  var preSrcData=preSrcCtx.getImageData(0,0,cur.width,cur.height).data;\n  var psw=cur.width,psh=cur.height;\n\n  ovSet(12,'Lanczos resampling…',null);await tick();\n\n  // ── Chunked Lanczos resampling ──\n  var tw=usOutW,th=usOutH,a=3;\n  var xRatio=psw/tw,yRatio=psh/th;\n  var dstCv=document.createElement('canvas');dstCv.width=tw;dstCv.height=th;\n  var dstCtx=dstCv.getContext('2d'),dstImg=dstCtx.createImageData(tw,th),dstData=dstImg.data;\n  var LROW=8; // rows per chunk — keeps UI responsive\n  var totalRows=th;\n\n  for(var dy=0;dy<th;dy+=LROW){\n    var rowEnd=Math.min(dy+LROW,th);\n    for(var dyr=dy;dyr<rowEnd;dyr++){\n      var srcY=dyr*yRatio,y0=Math.floor(srcY);\n      for(var dx=0;dx<tw;dx++){\n        var srcX=dx*xRatio,x0=Math.floor(srcX);\n        var r=0,g=0,b=0,al=0,wSum=0;\n        for(var ky=y0-a+1;ky<=y0+a;ky++){\n          for(var kx=x0-a+1;kx<=x0+a;kx++){\n            var cx=Math.max(0,Math.min(psw-1,kx)),cy=Math.max(0,Math.min(psh-1,ky));\n            var lx=Math.PI*(srcX-kx),ly=Math.PI*(srcY-ky);\n            var wx=(lx===0)?1:(a*Math.sin(lx)*Math.sin(lx/a))/(lx*lx);\n            var wy=(ly===0)?1:(a*Math.sin(ly)*Math.sin(ly/a))/(ly*ly);\n            var w=wx*wy;\n            var si=(cy*psw+cx)*4;\n            r+=preSrcData[si]*w;g+=preSrcData[si+1]*w;b+=preSrcData[si+2]*w;al+=preSrcData[si+3]*w;wSum+=w;\n          }\n        }\n        var di=(dyr*tw+dx)*4;\n        dstData[di]=Math.max(0,Math.min(255,Math.round(r/wSum)));\n        dstData[di+1]=Math.max(0,Math.min(255,Math.round(g/wSum)));\n        dstData[di+2]=Math.max(0,Math.min(255,Math.round(b/wSum)));\n        dstData[di+3]=Math.max(0,Math.min(255,Math.round(al/wSum)));\n      }\n    }\n    // Progress: Lanczos = 12→70%\n    var lanczPct=12+((dy+LROW)/totalRows)*58;\n    var elapsed=(Date.now()-_startTs)/1000;\n    var eta=elapsed/Math.max(0.001,(dy+LROW)/totalRows)*(1-(dy+LROW)/totalRows);\n    ovSet(lanczPct,'Lanczos resampling row '+(dy+LROW)+'/'+th+'…',eta);\n    await tick();\n  }\n  dstCtx.putImageData(dstImg,0,0);\n\n  ovSet(72,'Sharpening (float-domain)…',null);await tick();\n\n  // ── Unsharp mask ──\n  var scaleArea=(tw*th)/(sw*sh),logScale=Math.log2(Math.max(1.001,scaleArea));\n  var amount=Math.min(6.0,2*Math.pow(logScale,0.9837));\n  var sigmaSh=Math.min(2.5,0.6+0.2*logScale);\n  var imgd=dstCtx.getImageData(0,0,tw,th),d=imgd.data,n=tw*th;\n  var R=new Float64Array(n),G=new Float64Array(n),B=new Float64Array(n);\n  for(var i=0;i<n;i++){R[i]=d[i*4];G[i]=d[i*4+1];B[i]=d[i*4+2];}\n  usUsmFloat(R,tw,th,amount*0.55*usSharpCoeff,sigma t.getElementById('us-ssize').textContent=sz;\n    document.getElementById('us-rdims').innerHTML='<b>'+usOutW+' × '+usOutH+' px</b>  ·  '+usFmt.toUpperCase()+'  ·  '+sz;\n    ovSet(100,'Done!',0);\n    usResultcard.style.display='block';\n    setTimeout(function(){usResultcard.scrollIntoView({behavior:'smooth',block:'start'});},100);\n    usUpscalebtn.disabled=false;usUpscalebtn.textContent='Upscale ↑';\n    ovHide();\n    // also hide old inline bar\n    setTimeout(function(){usProgwrap.style.display='none';},800);\n  },mime,q);\n}\n\n})(); // end UpScale IIFE\n\n\n(function(){\n  const bar=document.getElementById('scroll-progress');\n  if(!bar)return;\n  window.addEventListener('scroll',()=>{\n    const pct=window.scrollY/(document.body.scrollHeight-window.innerHeight)*100;\n    bar.style.width=Math.min(pct,100)+'%';\n  },{passive:true});\n})();\n\n/* ═══════════════════════════════════════════════════\n   AMBIENT PARTICLES\n═══════════════════════════════════════════════════ */\n(function(){\n  const canvas=document.getElementById('particle-canvas');\n  if(!canvas)return;\n  const ctx=canvas.getContext('2d');\n  let W,H;\n  const N=50;\n  const particles=[];\n  const isDark = () => document.documentElement.getAttribute('data-theme') !== 'light';\n  // Dark: violet, lavender, plum shimmer\n  const COLORS_DARK  = ['#B7A4FF','#9A86E0','rgba(224,210,255,0.50)','#D0BDF2'];\n  // Light: aurora teal, green, warm umber — vivid on warm parchment bg\n  const COLORS_LIGHT = ['#4A8FAD','#57A86A','#6AAFCD','#3B8C4E'];\n  const getColors = () => isDark() ? COLORS_DARK : COLORS_LIGHT;\n\n  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}\n  resize();\n  window.addEventListener('resize',resize);\n\n  function Particle(){this.init(true);}\n  Particle.prototype.init=function(rand){\n    this.x=Math.random()*W;\n    this.y=rand?Math.random()*H:H+8;\n    this.r=.7+Math.random()*1.6;\n    this.vy=-(0.15+Math.random()*.28);\n    this.vx=(Math.random()-.5)*.25;\n    this.al=0;\n    this.tal=.1+Math.random()*.25;\n    this.tw=Math.random()*Math.PI*2;\n    this.ts=.01+Math.random()*.018;\n    this.col=getColors()[Math.floor(Math.random()*COLORS_DARK.length)];\n  };\n  Particle.prototype.update=function(){\n    this.x+=this.vx; this.y+=this.vy;\n    this.tw+=this.ts;\n    this.al+=(this.tal-this.al)*.04;\n    if(this.y<-8){this.init(false);this.col=getColors()[Math.floor(Math.random()*COLORS_DARK.length)];}\n  };\n  Particle.prototype.draw=function(){\n    ctx.globalAlpha=this.al*(.55+.45*Math.sin(this.tw));\n    ctx.fillStyle=this.col;\n    ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();\n  };\n\n  let mx=W/2,my=H/2;\n  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});\n\n  for(let i=0;i<N;i++)particles.push(new Particle());\n\n  (function loop(){\n    ctx.clearRect(0,0,W,H);\n    particles.forEach(p=>{\n      const dx=mx-p.x,dy=my-p.y,d=Math.sqrt(dx*dx+dy*dy);\n      if(d<160){p.vx+=dx/d*.005;p.vy+=dy/d*.005;}\n      const sp=Math.sqrt(p.vx*p.vx+p.vy*p.vy);\n      if(sp>.8){p.vx*=.8/sp;p.vy*=.8/sp;}\n      p.update();p.draw();\n    });\n    ctx.globalAlpha=1;\n    requestAnimationFrame(loop);\n  })();\n})();\n\n/* ═══════════════════════════════════════════════════\n   SCROLL REVEAL — re-animates every time in view\n   Also hands off headings to .anim-done once their\n   entry keyframe finishes so hover transitions work\n   without any animation/transition conflict.\n═══════════════════════════════════════════════════ */\n(function(){\n  const els=document.querySelectorAll('.reveal,.reveal-left,.reveal-right,.reveal-scale');\n\n  function addAnimDone(el){\n    /* wait for the headingPop keyframe to fully finish,\n       then swap to pure transition-based state        */\n    el.addEventListener('animationend', function onEnd(){\n      el.removeEventListener('animationend', onEnd);\n      el.classList.add('anim-done');\n    });\n  }\n\n  const io=new IntersectionObserver(entries=>{\n    entries.forEach(e=>{\n      const el = e.target;\n      if(e.isIntersecting){\n        el.classList.add('visible');\n        /* attach anim-done listener for heading elements */\n        if(\n          (el.classList.contains('section-title') || el.classList.contains('hero-title'))\n          && !el.classList.contains('anim-done')\n        ){\n          addAnimDone(el);\n        }\n      } else {\n        /* reset for re-animation on next scroll-in */\n        el.classList.remove('visible');\n        el.classList.remove('anim-done');\n        if(el.classList.contains('section-title')||el.classList.contains('hero-title')){\n          el.style.animation='none';\n          void el.offsetWidth; /* force reflow */\n          el.style.animation='';\n        }\n      }\n    });\n  },{threshold:.08,rootMargin:'0px 0px -40px 0px'});\n\n  els.forEach(el=>io.observe(el));\n})();\n\n/* ═══════════════════════════════════════════════════\n   BUTTON RIPPLE\n═══════════════════════════════════════════════════ */\ndocument.addEventListener('click',e=>{\n  const btn=e.target.closest('.btn,.preset-btn,.toggle-btn');\n  if(!btn)return;\n  const r=btn.getBoundingClientRect();\n  const sz=Math.max(r.width,r.height)*2;\n  const rip=document.createElement('span');\n  rip.className='ripple-wave';\n  rip.style.cssText=`width:${sz}px;height:${sz}px;left:${e.clientX-r.left-sz/2}px;top:${e.clientY-r.top-sz/2}px`;\n  btn.appendChild(rip);\n  rip.addEventListener('animationend',()=>rip.remove());\n});\n\n/* ═══════════════════════════════════════════════════\n   KEYBOARD SHORTCUTS\n═══════════════════════════════════════════════════ */\n(function(){\n  const hint=document.getElementById('shortcut-hint');\n  let t;\n  function show(msg){\n    if(!hint)return;\n    hint.textContent=msg;\n    hint.classList.add('show');\n    clearTimeout(t);\n    t=setTimeout(()=>hint.classList.remove('show'),1800);\n  }\n  document.addEventListener('keydown',e=>{\n    if(e.target.tagName==='INPUT'||e.target.isContentEditable)return;\n    if(e.key==='1'){document.getElementById('colorpicker').scrollIntoView({behavior:'smooth'});show('⌨  01 — ColorDrop');}\n    if(e.key==='2'){document.getElementById('hueeditor').scrollIntoView({behavior:'smooth'});show('⌨  02 — HUE Editor');}\n    if(e.key==='3'){document.getElementById('recolor').scrollIntoView({behavior:'smooth'});show('⌨  03 — Chroma');}\n    if(e.key==='4'){document.getElementById('upscale').scrollIntoView({behavior:'smooth'});show('⌨  04 — UpScale');}\n    if(e.key.toLowerCase()==='m'){document.getElementById('audio-toggle').click();show('⌨  Toggle lo-fi');}\n    if(e.key==='?')show('1·2·3·4 = Jump  M = Music  ? = Help');\n  });\n})();\n\n/* ═══════════════════════════════════════════════════\n   THEME TOGGLE — Light / Dark\n═══════════════════════════════════════════════════ */\n(function(){\n  const btn  = document.getElementById('theme-toggle');\n  const icon = document.getElementById('theme-icon');\n  const root = document.documentElement;\n\n  // Persist preference\n  const saved = localStorage.getItem('theme') || 'dark';\n  applyTheme(saved);\n\n  btn.addEventListener('click', () => {\n    const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';\n    applyTheme(next);\n    localStorage.setItem('theme', next);\n  });\n\n  function applyTheme(theme){\n    root.setAttribute('data-theme', theme);\n    icon.textContent = theme === 'light' ? '☽' : '☀';\n    btn.title = theme === 'light' ? 'Switch to dark mode' : 'Switch to light mode';\n  }\n})();\n\n\n(function(){\n  const links=document.querySelectorAll('nav a');\n  const ids=['colorpicker','hueeditor','recolor','upscale'];\n  window.addEventListener('scroll',()=>{\n    let cur='';\n    ids.forEach(id=>{const s=document.getElementById(id);if(s&&window.scrollY>=s.offsetTop-220)cur=id;});\n    links.forEach(a=>{\n      const h=a.getAttribute('href').replace('#','');\n      a.style.color=h===cur?'var(--accent)':'';\n    });\n  },{passive:true});\n})();\n\n\n\n/* ═══════════════════════════════════════════════════\n   DYNAMIC ENHANCEMENTS — JS\n═══════════════════════════════════════════════════ */\n\n/* ── AUTO-HIDE HEADER ──────────────────────────────── */\n(function(){\n  const header=document.querySelector('header');\n  let lastY=0,ticking=false;\n  window.addEventListener('scroll',()=>{\n    if(ticking)return;ticking=true;\n    requestAnimationFrame(()=>{\n      const y=window.scrollY;\n      if(y>120){\n        header.classList.toggle('header-hidden',y>lastY&&y>300);\n        header.classList.add('header-scrolled');\n      }else{\n        header.classList.remove('header-hidden','header-scrolled');\n      }\n      lastY=y;ticking=false;\n    });\n  },{passive:true});\n})();\n\n})();\n\n/* ── 3D CARD TILT ON MOUSEMOVE ─────────────────────── */\n(function(){\n  const tiltEls=document.querySelectorAll('.card,.picker-widget');\n  tiltEls.forEach(el=>{\n    el.addEventListener('mousemove',e=>{\n      const r=el.getBoundingClientRect();\n      const x=(e.clientX-r.left)/r.width-.5;\n      const y=(e.clientY-r.top)/r.height-.5;\n      el.style.transform=`perspective(800px) rotateY(${x*6}deg) rotateX(${-y*6}deg) scale(1.01)`;\n    });\n    el.addEventListener('mouseleave',()=>{\n      el.style.transform='';\n    });\n  });\n})();\n\n/* ── MAGNETIC BUTTON EFFECT ────────────────────────── */\n(function(){\n  const btns=document.querySelectorAll('.btn-accent,.hero-cta .btn');\n  btns.forEach(btn=>{\n    btn.addEventListener('mousemove',e=>{\n      const r=btn.getBoundingClientRect();\n      const x=e.clientX-r.left-r.width/2;\n      const y=e.clientY-r.top-r.height/2;\n      btn.style.transform=`translate(${x*.15}px,${y*.15}px) scale(1.04)`;\n    });\n    btn.addEventListener('mouseleave',()=>{\n      btn.style.transform='';\n    });\n  });\n})();\n\n/* scramble handled by outer script */\n\n/* ── PARALLAX FLOATING SHAPES ──────────────────────── */\n(function(){\n  const shapes=document.querySelectorAll('.hero-float');\n  if(!shapes.length)return;\n  window.addEventListener('scroll',()=>{\n    const y=window.scrollY;\n    shapes.forEach((s,i)=>{\n      const speed=0.02+i*0.015;\n      s.style.transform=`translateY(${y*speed*-1}px) rotate(${y*0.02*(i%2?1:-1)}deg)`;\n    });\n  },{passive:true});\n})();\n\n/* ── SMOOTH NAV ACTIVE STATE ───────────────────────── */\n(function(){\n  const links=document.querySelectorAll('nav a[href^=\"#\"]');\n  const ids=['colorpicker','hueeditor','recolor','upscale'];\n  window.addEventListener('scroll',()=>{\n    let cur='';\n    ids.forEach(id=>{\n      const s=document.getElementById(id);\n      if(s&&window.scrollY>=s.offsetTop-220)cur=id;\n    });\n    links.forEach(a=>{\n      const h=a.getAttribute('href').replace('#','');\n      a.classList.toggle('active',h===cur);\n    });\n  },{passive:true});\n})();\n\n/* ── SECTION NUMBER COUNTER ────────────────────────── */\n(function(){\n  const nums=document.querySelectorAll('.section-num');\n  nums.forEach(n=>{\n    const io=new IntersectionObserver(entries=>{\n      entries.forEach(e=>{\n        if(e.isIntersecting){\n          n.style.opacity='0';n.style.transform='translateX(-12px)';\n          requestAnimationFrame(()=>{\n            n.style.transition='opacity .6s ease,transform .6s ease';\n            n.style.opacity='1';n.style.transform='translateX(0)';\n          });\n        }\n      });\n    },{threshold:.5});\n    io.observe(n);\n  });\n})();\n\n/* ── FEATURE LIST STAGGER (add stagger-in class) ───── */\n(function(){\n  document.querySelectorAll('.features-list').forEach(fl=>{\n    fl.classList.add('stagger-in');\n    const io=new IntersectionObserver(entries=>{\n      entries.forEach(e=>{\n        fl.classList.toggle('visible',e.isIntersecting);\n      });\n    },{threshold:.2});\n    io.observe(fl);\n  });\n})();\n";
    d.body.appendChild(scriptEl);
