function initScramble(iframeDoc) {
  var title = iframeDoc.querySelector('.hero-title');
  if (!title) return;
  var chars = '!<>-_\/[]{}=+*^?#ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  var walker = iframeDoc.createTreeWalker(title, NodeFilter.SHOW_TEXT);
  var textNodes = [];
  var node;
  while (node = walker.nextNode()) {
    if (node.textContent.trim().length > 0)
      textNodes.push({ node: node, original: node.textContent });
  }
  if (!textNodes.length) return;
  title.style.opacity = '1';
  title.style.transform = 'translateY(0) scale(1)';
  title.style.color = 'var(--lavender, #E0D2FF)';
  var totalPhase1 = 14;
  var totalPhase2 = 36;
  var totalFrames = totalPhase1 + totalPhase2;
  var frame = 0;
  var interval = 28;
  function randChar() { return chars[Math.floor(Math.random() * chars.length)]; }
  function tick() {
    frame++;
    if (frame <= totalPhase1) {
      textNodes.forEach(function(tn) {
        var result = '';
        for (var i = 0; i < tn.original.length; i++) {
          var c = tn.original[i];
          result += (c === ' ' || c === '\n') ? c : randChar();
        }
        tn.node.textContent = result;
      });
    } else {
      var progress = (frame - totalPhase1) / totalPhase2;
      textNodes.forEach(function(tn) {
        var result = '';
        for (var i = 0; i < tn.original.length; i++) {
          var c = tn.original[i];
          if (c === ' ' || c === '\n') { result += c; continue; }
          result += (i / tn.original.length < progress) ? c : randChar();
        }
        tn.node.textContent = result;
      });
    }
    if (frame < totalFrames) {
      setTimeout(tick, interval);
    } else {
      textNodes.forEach(function(tn) { tn.node.textContent = tn.original; });
      title.removeAttribute('style');
      title.classList.add('anim-done');
    }
  }
  tick();
}
var _iframe = document.getElementById('_f');
_iframe.addEventListener('load', function() {
  try { initScramble(_iframe.contentDocument || _iframe.contentWindow.document); }
  catch(e) { console.warn('Scramble init failed:', e); }
});
